<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>변경권 내 희귀 아이템 - TR 콜렉션북</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gugi&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root{
    --bg: #14141c;
    --panel: #1c1c28;
    --panel-2: #23232f;
    --line: #33333f;
    --text: #e9e9f0;
    --sub: #8a8a9a;
    --gem: #7dd3fc;
    --gem-2: #a78bfa;
    --warn: #f4c150;
    --danger: #f76c6c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: radial-gradient(1200px 600px at 15% -10%, #23233a 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Noto Sans KR', sans-serif;
    padding:32px 16px 80px;
    -webkit-user-select:none; -moz-user-select:none; user-select:none;
  }
  img{ -webkit-user-drag:none; user-drag:none; pointer-events:none; }
  input, textarea{ -webkit-user-select:text; user-select:text; } /* 검색창 입력은 선택 가능해야 함 */
  .wrap{ width:100%; max-width:1100px; margin:0 auto; }

  .back-link{
    display:inline-flex; align-items:center; gap:4px;
    color:var(--sub); text-decoration:none; font-size:13px;
    margin-bottom:16px;
  }
  .back-link:hover{ color:var(--text); }

  .header{ display:flex; align-items:center; gap:8px; margin-bottom:20px; }
  .header h1{
    font-family:'Gugi', sans-serif;
    font-size:28px; margin:0; font-weight:400;
    background: linear-gradient(90deg, var(--gem), var(--gem-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .info-icon{
    position:relative;
    display:inline-flex; align-items:center; justify-content:center;
    width:17px; height:17px; border-radius:50%;
    background:var(--panel-2); border:1px solid var(--line); color:var(--sub);
    font-size:11px; font-weight:700; font-style:normal; cursor:default; flex:0 0 auto;
  }
  .info-icon .tip{
    display:none;
    position:absolute; top:calc(100% + 6px); left:0;
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; width:220px; font-size:11.5px; line-height:1.5; font-weight:400; color:var(--text);
    box-shadow:0 4px 14px rgba(0,0,0,.4); z-index:30;
  }
  .info-icon:hover .tip{ display:block; }

  /* 콜렉션 연동 배지 */
  .connect-badge{
    margin-left:auto; display:inline-flex; align-items:center; gap:6px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:20px;
    padding:6px 12px 6px 10px; font-size:12px; color:var(--text); cursor:pointer; flex:0 0 auto;
  }
  .connect-badge:hover{ border-color:var(--sub); }
  .connect-dot{ width:8px; height:8px; border-radius:50%; background:#666; flex:0 0 auto; }
  .connect-badge.connected .connect-dot{ background:#3ddc73; box-shadow:0 0 6px #3ddc7399; }

  .connect-modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100;
    align-items:center; justify-content:center; padding:16px;
  }
  .connect-modal-overlay.show{ display:flex; }
  .connect-modal{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px; width:100%; max-width:320px;
  }
  .connect-modal h3{ margin:0 0 12px; font-size:15px; color:var(--text); }
  .connect-modal .connect-tab-row{ display:flex; gap:6px; margin-bottom:12px; }
  .connect-modal .connect-tab-row button{
    flex:1; padding:7px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--sub); font-size:12px; cursor:pointer;
  }
  .connect-modal .connect-tab-row button.active{ color:var(--text); border-color:var(--gem); }
  .connect-modal input{
    width:100%; box-sizing:border-box; padding:9px 10px; margin-bottom:8px;
    border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); font-size:13px;
  }
  .connect-modal .connect-submit{
    width:100%; padding:9px; border-radius:8px; border:none;
    background:var(--gem); color:#04120c; font-weight:700; font-size:13px; cursor:pointer;
  }
  .connect-modal .connect-msg{ font-size:11.5px; color:var(--warn); margin:6px 0 0; min-height:14px; }
  .connect-modal .connect-close{
    display:block; margin:10px auto 0; background:none; border:none; color:var(--sub); font-size:12px; cursor:pointer;
  }
  .connect-modal .connect-connected-box{ font-size:13px; color:var(--text); line-height:1.6; }
  .connect-modal .connect-disconnect{
    margin-top:10px; width:100%; padding:8px; border-radius:8px; border:1px solid var(--line);
    background:transparent; color:var(--danger); font-size:12.5px; cursor:pointer;
  }

  /* 보유/미보유 표시 */
  .item-card.item-owned{ opacity:.45; }
  .item-card .owned-badge{
    position:absolute; top:4px; left:4px; background:rgba(61,220,115,.28); color:var(--sub);
    font-size:9.5px; font-weight:600; border-radius:4px; padding:1px 5px; z-index:2;
  }
  .unowned-toggle{
    display:flex; align-items:center; gap:8px; font-size:12px; color:var(--sub);
    margin:10px 0 4px;
  }
  .ios-switch{
    position:relative; width:36px; height:20px; border-radius:20px; background:var(--panel-2);
    border:1px solid var(--line); cursor:pointer; flex:0 0 auto;
  }
  .ios-switch::after{
    content:''; position:absolute; top:1px; left:1px; width:16px; height:16px; border-radius:50%;
    background:var(--sub); transition:transform .15s, background .15s;
  }
  .ios-switch.on{ background:var(--gem); border-color:var(--gem); }
  .ios-switch.on::after{ transform:translateX(16px); background:#04120c; }

  /* 관리자 추천순 드래그 정렬 */
  .item-card.drag-mode{ cursor:grab; }
  .item-card.dragging{ opacity:.4; }
  .item-card.drag-over{ outline:2px dashed var(--gem); outline-offset:2px; }

  /* 상단 컨트롤 바 */
  .control-bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:18px;
    position:sticky; top:8px; z-index:20;
  }
  .search-box{ flex:1 1 200px; position:relative; display:flex; align-items:center; }
  .search-box input{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:8px; font-size:14px; font-family:inherit;
  }
  .search-box input:focus{ outline:none; border-color:var(--gem); }
  .search-clear{
    display:none; position:absolute; right:8px; background:none; border:none;
    color:var(--sub); font-size:14px; cursor:pointer; padding:2px 4px;
  }
  .search-clear.show{ display:block; }

  .pill-toggle{ display:flex; gap:4px; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:3px; flex-wrap:wrap; }
  .pill-toggle button{
    border:none; background:transparent; color:var(--sub);
    font-family:inherit; font-size:12px; font-weight:700;
    padding:7px 10px; border-radius:6px; cursor:pointer; white-space:nowrap;
  }
  .pill-toggle button.active{ background:linear-gradient(90deg, var(--gem), var(--gem-2)); color:#14141c; }

  /* 상세 패널 안, 아이템 목록 바로 위에 놓이는 보기/정렬 컨트롤 */
  .list-controls{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-bottom:14px; padding-bottom:14px; border-bottom:1px dashed var(--line);
  }
  .list-controls .divider{ width:1px; height:18px; background:var(--line); margin:0 2px; }

  .result-summary{ font-size:12px; color:var(--sub); margin-bottom:14px; }
  .result-summary b{ color:var(--gem); font-weight:700; }

  /* 변경권 그룹 탭 (Rev·Lite.1 / New.2) */
  .ticket-group-tabs{
    display:flex; gap:10px; margin-bottom:14px;
  }
  .ticket-group-tab{
    flex:1; position:relative;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    background:var(--panel); border:2px solid var(--line); border-radius:14px;
    padding:16px 10px; cursor:pointer; font-family:inherit;
    transition:border-color .15s;
  }
  .ticket-group-tab:hover{ border-color:var(--gem); }
  .ticket-group-tab.active{ border-color:var(--warn); }
  .ticket-group-tab.active::after{
    content:''; position:absolute; top:10px; right:10px;
    width:7px; height:7px; border-radius:50%; background:var(--warn);
  }
  .ticket-group-badge{
    display:flex; align-items:center; justify-content:center;
    width:60px; height:60px; border-radius:14px;
    border:2px solid var(--line); font-weight:900; font-size:15px; color:var(--sub);
  }
  .ticket-group-tab.active .ticket-group-badge{ border-color:var(--warn); color:var(--warn); }
  .ticket-group-label{ font-size:13px; font-weight:700; color:var(--sub); }
  .ticket-group-tab.active .ticket-group-label{ color:var(--text); }

  /* 변경권 선택 카드 (넓은 화면일수록 한 줄에 더 많이, 좁아지면 자동으로 줄어듦) */
  .ticket-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:8px;
    margin-bottom:22px;
  }
  @media (max-width:480px){ .ticket-grid{ grid-template-columns:repeat(2, 1fr); gap:8px; } }
  .ticket-card{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 6px; cursor:pointer; font-family:inherit;
    transition:border-color .15s;
  }
  .ticket-card:hover{ border-color:var(--gem); }
  .ticket-card.active{ border-color:var(--warn); background:var(--panel-2); }
  .ticket-card.ticket-hidden{ display:none; }
  .ticket-icon{
    width:60px; height:60px; border-radius:14px;
    background:var(--panel-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex:0 0 auto;
  }
  .ticket-icon img{ width:100%; height:100%; object-fit:contain; display:block; }
  .ticket-icon .fallback{ font-size:10px; color:var(--sub); text-align:center; line-height:1.3; padding:2px; }
  .ticket-name{ font-size:13px; font-weight:700; text-align:center; line-height:1.35; color:var(--text); }
  .ticket-count{ font-size:10px; color:var(--sub); }
  .ticket-card.active .ticket-count{ color:var(--warn); }

  /* 상세 목록 패널 */
  .detail-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px; min-height:120px;
  }
  .detail-title{
    display:flex; align-items:center; gap:10px; margin-bottom:14px;
    font-size:14px; font-weight:700;
  }
  .detail-title .ticket-icon{ width:34px; height:34px; }
  .detail-empty{ color:var(--sub); font-size:13px; text-align:center; padding:30px 10px; }

  .item-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:10px;
  }
  .item-card{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    padding:10px 6px; text-align:center;
  }
  .item-card.row-hidden{ display:none; }
  .item-card.ticket-highlight{ border-color:var(--warn); box-shadow:0 0 0 1px var(--warn); }
  .search-hint{ font-size:11px; color:var(--sub); margin:-4px 0 12px; }
  .search-hint b{ color:var(--warn); font-weight:700; }
  .item-icon{
    width:44px; height:44px; border-radius:8px; flex:0 0 auto;
    background:var(--panel); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .item-icon img{ width:100%; height:100%; object-fit:contain; display:block; }
  .item-icon .fallback{ font-size:10px; color:var(--sub); }
  .item-name{ font-size:11px; line-height:1.35; word-break:keep-all; }
  .item-part{ color:var(--sub); font-weight:400; }
  .item-name mark{ background:rgba(244,193,80,.35); color:var(--warn); border-radius:3px; padding:0 1px; }
  .item-tags{ font-size:9px; color:var(--sub); }

  /* 호버 툴팁 (등급/부위/전용) */
  .item-tooltip{
    display:none;
    position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; width:140px; font-size:11px; line-height:1.6;
    box-shadow:0 4px 14px rgba(0,0,0,.4); z-index:30; text-align:left;
  }
  .item-tooltip b{ color:var(--gem); font-weight:700; }
  .item-tooltip .tt-row{ display:flex; justify-content:space-between; gap:6px; }
  .item-tooltip .tt-row span:first-child{ color:var(--sub); }
  .item-card:hover .item-tooltip{ display:block; }

  /* 뷰 모드: 이름만 보기 — 한 줄에 하나씩, 세로로 쭉 */
  .item-grid.mode-name{ grid-template-columns:1fr; gap:6px; }
  .item-grid.mode-name .item-card{
    flex-direction:row; justify-content:flex-start; text-align:left;
    padding:8px 12px; gap:0;
  }
  .item-grid.mode-name .item-icon{ display:none; }

  /* 뷰 모드: 사진만 보기 — 여백을 확 줄여서 촘촘한 사진 그리드로 */
  .item-grid.mode-photo{ grid-template-columns:repeat(auto-fill, minmax(56px, 1fr)); gap:5px; }
  .item-grid.mode-photo .item-card{ padding:3px; border-radius:8px; gap:0; }
  .item-grid.mode-photo .item-name{ display:none; }
  .item-grid.mode-photo .item-icon{ width:100%; height:auto; aspect-ratio:1/1; border-radius:6px; }

  .item-card{ cursor:pointer; }
  .item-card:hover{ border-color:var(--gem); }

  /* 아이템 상세보기 모달 */
  .detail-modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(10,10,16,.72);
    z-index:100; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto;
  }
  .detail-modal-overlay.open{ display:flex; }
  .detail-modal{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    width:100%; max-width:420px; padding:20px; position:relative;
  }
  .detail-modal-close{
    position:absolute; top:14px; left:14px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--sub);
    width:28px; height:28px; border-radius:8px; cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .detail-modal-close:hover{ color:var(--text); border-color:var(--gem); }
  .detail-copy-btn{
    position:absolute; top:14px; right:14px;
    display:flex; align-items:center; gap:5px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--sub);
    padding:6px 10px; border-radius:8px; cursor:pointer; font-size:11px; font-weight:700;
    font-family:inherit; transition:border-color .15s, color .15s;
  }
  .detail-copy-btn:hover{ color:var(--gem); border-color:var(--gem); }
  .detail-copy-btn.copied{ color:#7ee787; border-color:#7ee787; }
  .detail-modal-head{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    text-align:center; margin:26px 0 18px;
  }
  .detail-modal-icon{
    width:88px; height:88px; border-radius:14px;
    background:var(--panel-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .detail-modal-icon img{ width:100%; height:100%; object-fit:contain; display:block; }
  .detail-modal-icon .fallback{ font-size:13px; color:var(--sub); }
  .detail-modal-name{ font-size:16px; font-weight:700; word-break:keep-all; }
  .detail-modal-tags{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .detail-tag{
    font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--sub);
  }
  .detail-tag.grade{ color:var(--warn); border-color:var(--warn); }

  .detail-section{ margin-bottom:16px; }
  .detail-section:last-child{ margin-bottom:0; }
  .detail-section-title{
    font-size:11px; font-weight:700; color:var(--sub); margin-bottom:8px;
    display:flex; align-items:center; gap:6px;
  }
  .detail-ticket-list{ display:flex; flex-direction:column; gap:6px; }
  .detail-ticket-chip{
    display:flex; align-items:center; gap:8px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:7px 10px; font-size:12px; cursor:pointer; text-align:left;
    font-family:inherit; color:var(--text); width:100%;
  }
  .detail-ticket-chip:hover{ border-color:var(--gem); }
  .detail-ticket-chip .ticket-icon{ width:26px; height:26px; flex:0 0 auto; }
  .detail-route-rows{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; font-size:12px; line-height:1.7;
  }
  .detail-route-row{ display:flex; gap:8px; }
  .detail-route-row + .detail-route-row{ margin-top:4px; padding-top:4px; border-top:1px dashed var(--line); }
  .detail-route-row span:first-child{ color:var(--sub); flex:0 0 auto; white-space:nowrap; }
  .detail-empty-routes{ color:var(--sub); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">

  <div>
    <a class="back-link" href="/">← 콜렉션북으로</a>
  </div>

  <div class="header">
    <h1>변경권 아이템 목록</h1>
    <span class="info-icon">i<span class="tip">변경권마다 나오는 아이템을 볼 수 있는 공간이에요. 변경권을 고르면 아래에 목록이 뜨고, 검색하면 모든 변경권을 통틀어 찾아줘요.</span></span>
    <button type="button" class="connect-badge" id="lab2-connect-badge">
      <span class="connect-dot"></span><span class="connect-label">연동</span>
    </button>
  </div>

  <div class="control-bar">
    <div class="search-box">
      <input type="text" id="lab2-search" placeholder="아이템 이름으로 검색">
      <button class="search-clear" id="lab2-search-clear">✕</button>
    </div>
  </div>

  <div class="result-summary" id="lab2-summary"></div>

  <div class="ticket-group-tabs" id="lab2-group-tabs"></div>

  <div class="ticket-grid" id="lab2-ticket-grid"></div>

  <div class="detail-panel" id="lab2-detail">
    <div class="detail-empty">위에서 변경권을 선택하면 아이템 목록이 여기 나와요. 검색을 하면 모든 변경권을 통틀어 찾아줘요.</div>
  </div>

</div>

<div class="detail-modal-overlay" id="lab2-item-modal">
  <div class="detail-modal">
    <button type="button" class="detail-modal-close" id="lab2-item-modal-close">✕</button>
    <button type="button" class="detail-copy-btn" id="lab2-item-copy-btn">이름 복사</button>
    <div id="lab2-item-modal-body"></div>
  </div>
</div>

<div class="connect-modal-overlay" id="lab2-connect-modal">
  <div class="connect-modal">
    <div id="lab2-connect-modal-body"></div>
    <button type="button" class="connect-close" id="lab2-connect-modal-close">닫기</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

// gas.js의 _enc()를 그대로 역으로 복호화 (동일한 XOR 키 사용)
function _dec(hexStr, key = 'T4r!Rk@9mZ#2xQ$7') {
  const bytes = [];
  for (let i = 0; i < hexStr.length; i += 2) bytes.push(parseInt(hexStr.substr(i, 2), 16));
  let b64 = '';
  for (let i = 0; i < bytes.length; i++) b64 += String.fromCharCode(bytes[i] ^ key.charCodeAt(i % key.length));
  const binary = atob(b64);
  const utf8Bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) utf8Bytes[i] = binary.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(utf8Bytes));
}

async function loadItemMeta(){
  const wanted = new Set(TICKET_DATA.flatMap(function(c){ return c.items; }));
  try {
    const res = await fetch('/api/gas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'getMasterItems', args: [] })
    });
    const json = await res.json();
    if (!json.ok) { console.error('아이템 정보 조회 실패:', json.error); return; }
    // getMasterItems 반환 순서: [id, grade, part, name, memo, image_url, '', source, route, user_route, exclusive, gender]
    const rows = _dec(json.data);
    rows.forEach(function(row){
      const name = row[3];
      if (!wanted.has(name)) return;
      const image_url = row[5];
      if (image_url) ITEM_IMAGES[name] = image_url;
      ITEM_META[name] = {
        id: Number(row[0]), grade: row[1], part: row[2], exclusive: row[10],
        memo: row[4], source: row[7], route: row[8], user_route: row[9], gender: row[11]
      };
    });
  } catch (err) {
    console.error('아이템 정보 조회 실패:', err);
  }
  // DB에 없는 특수 아이템은 수동 등록값으로 보충
  Object.keys(ITEM_OVERRIDES).forEach(function(name){
    if (!wanted.has(name)) return;
    const o = ITEM_OVERRIDES[name];
    if (!ITEM_IMAGES[name] && o.image_url) ITEM_IMAGES[name] = o.image_url;
    if (!ITEM_META[name]) ITEM_META[name] = {

      memo: o.memo || '', source: o.source || '', route: o.route || '', user_route: o.user_route || '', gender: o.gender || ''
    };
  });
  renderTicketGrid();
  renderDetail();
}

function sortItems(names){
  const arr = names.slice();
  if (sortMode === 'alpha') {
    arr.sort(function(a, b){ return a.localeCompare(b, 'ko'); });
  } else if (sortMode === 'part') {
    arr.sort(function(a, b){
      const pa = PART_ORDER.indexOf((ITEM_META[a] || {}).part); const pb = PART_ORDER.indexOf((ITEM_META[b] || {}).part);
      const oa = pa === -1 ? 99 : pa; const ob = pb === -1 ? 99 : pb;
      if (oa !== ob) return oa - ob;
      return a.localeCompare(b, 'ko');
    });
  } else if (sortMode === 'recommend') {
    const orderMap = (selectedTicket && ticketOrderCache[selectedTicket]) || {};
    arr.sort(function(a, b){
      const oa = orderMap[a], ob = orderMap[b];
      if (oa != null && ob != null) return oa - ob;
      if (oa != null) return -1;
      if (ob != null) return 1;
      return a.localeCompare(b, 'ko');
    });
  } else { // latest: 마스터 ID 큰 순
    arr.sort(function(a, b){
      const ida = (ITEM_META[a] || {}).id;
      const idb = (ITEM_META[b] || {}).id;
      if (ida == null && idb == null) return 0;
      if (ida == null) return 1;
      if (idb == null) return -1;
      return idb - ida;
    });
  }
  return arr;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function displayTicketName(name){
  return name.replace(/\s*변경권\s*$/, '');
}

function fallbackLabel(name, isTicket){
  return isTicket ? name.replace(/변경권$/,'').trim() : name.slice(0, 2);
}

function iconHTML(name, url, isTicket){
  if (url) {
    const fb = esc(fallbackLabel(name, isTicket));
    return '<img src="' + esc(url) + '" alt="' + esc(name) + '" ' +
      'onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'fallback\',textContent:\'' + fb + '\'}))">';
  }
  return '<span class="fallback">' + esc(fallbackLabel(name, isTicket)) + '</span>';
}

function tooltipHTML(name){
  const meta = ITEM_META[name];

  const rows = [];

  return '<div class="item-tooltip">' + rows.join('') + '</div>';

// 부위가 뻔하지 않은(여러 부위가 섞여 나오는) 변경권에서만 [부위] 표시
// (펫 변경권처럼 애초에 한 부위만 나오는 경우엔 굳이 안 보여줘도 됨)
const PART_LABEL_TICKETS = new Set(['프레스티지', '다이아', '레인보우', '프라임', '골드', '레전더리', '노멀', '타임', '시그니처', '레어', '실버', '브론즈']);

function ticketShort(name){
  return name.replace(/^(Rev\/Lite\.1|Lite\.1\/Lite\.0|Lite\.1|New\.2)\s*/, '').replace(/^2nd\s+/, '').replace(/\s*변경권$/, '').replace(/\s*체스트\/티켓$/, '');
}

// 체스트/티켓 그룹 소속 이름 목록 (loadChestTicketData가 채움)
const CHEST_TICKET_NAMES = new Set();

function ticketGroup(name){
  if (CHEST_TICKET_NAMES.has(name)) return 'chest';
  return name.startsWith('New.2') ? 'new2' : 'rev';
}

const GROUP_LABELS = {
  rev:   { badge: 'Rev',  label: 'Rev·Lite.1' },
  new2:  { badge: 'New',  label: 'New.2' },
  chest: { badge: '체스트', label: '체스트/티켓' }
};

function renderGroupTabs(){
  const wrap = document.getElementById('lab2-group-tabs');
  wrap.innerHTML = ['rev', 'new2', 'chest'].map(function(g){
    const info = GROUP_LABELS[g];
    const active = activeGroup === g ? ' active' : '';
    return '<button type="button" class="ticket-group-tab' + active + '" data-group="' + g + '">' +
      '<div class="ticket-group-badge">' + esc(info.badge) + '</div>' +
      '<div class="ticket-group-label">' + esc(info.label) + '</div>' +
    '</button>';
  }).join('');
}

function itemAllowsPartLabel(itemName){
  return TICKET_DATA.some(function(t){
    return t.items.indexOf(itemName) !== -1 && PART_LABEL_TICKETS.has(ticketShort(t.name));
  });
}

function itemCardHTML(name, q, highlight, dragEnabled){
  let nameHTML = esc(name);
  if (q) {
    const idx = name.indexOf(q);
    if (idx !== -1) {
      nameHTML = esc(name.slice(0, idx)) + '<mark>' + esc(name.slice(idx, idx + q.length)) + '</mark>' + esc(name.slice(idx + q.length));
    }
  }
  const part = (ITEM_META[name] || {}).part;
  if (part && itemAllowsPartLabel(name)) nameHTML += ' <span class="item-part">[' + esc(part) + ']</span>';
  const owned = isItemOwned(name); // true | false | null(연동 안 됨/판별 불가)
  const ownedClass = owned === true ? ' item-owned' : '';
  const ownedBadge = owned === true ? '<span class="owned-badge">보유</span>' : '';
  return '<div class="item-card' + (highlight ? ' ticket-highlight' : '') + ownedClass + (dragEnabled ? ' drag-mode' : '') +
    '" data-name="' + esc(name) + '"' + (dragEnabled ? ' data-draggable="1"' : '') + '>' +
    ownedBadge +
    '<div class="item-icon">' + iconHTML(name, ITEM_IMAGES[name], false) + '</div>' +
    '<div class="item-name">' + nameHTML + '</div>' +
    tooltipHTML(name) +
  '</div>';
}

function renderTicketGrid(){
  const grid = document.getElementById('lab2-ticket-grid');
  const q = document.getElementById('lab2-search').value.trim();
  if (!activeGroup) {
    grid.innerHTML = '<div class="detail-empty" style="grid-column:1/-1">위에서 그룹을 선택하면 변경권 목록이 나와요.</div>';
    return;
  }
  grid.innerHTML = TICKET_DATA.filter(function(t){ return ticketGroup(t.name) === activeGroup; }).map(function(t){
    const active = selectedTicket === t.name ? ' active' : '';
    const hasMatch = !q || t.items.some(function(item){ return item.indexOf(q) !== -1; });
    const hidden = (q && !hasMatch) ? ' ticket-hidden' : '';
    return '<button type="button" class="ticket-card' + active + hidden + '" data-ticket="' + esc(t.name) + '">' +
      '<div class="ticket-icon">' + iconHTML(t.name, TICKET_IMAGES[t.name], true) + '</div>' +
      '<div class="ticket-name">' + esc(displayTicketName(t.name)) + '</div>' +
      '<div class="ticket-count">' + t.items.length + '개</div>' +
    '</button>';
  }).join('');
}

function renderDetail(){
  const panel = document.getElementById('lab2-detail');
  const q = document.getElementById('lab2-search').value.trim();

  if (q) {
    // 검색 중: 모든 변경권을 통틀어 일치하는 아이템을 한 번에 보여줌 (중복 제거)
    const seen = new Set();
    TICKET_DATA.forEach(function(t){
      t.items.forEach(function(item){
        if (item.indexOf(q) !== -1) seen.add(item);
      });
    });
    if (seen.size === 0) {
      panel.innerHTML = '<div class="detail-empty">검색 결과가 없어요.</div>';
      return;
    }
    const items = sortItems(Array.from(seen));
    // 변경권을 눌러둔 상태면, 그 변경권에서 나오는 아이템만 테두리로 표시
    const highlightTicket = selectedTicket ? TICKET_DATA.find(function(t){ return t.name === selectedTicket; }) : null;
    const highlightSet = highlightTicket ? new Set(highlightTicket.items) : null;
    const cards = items.map(function(item){ return itemCardHTML(item, q, highlightSet && highlightSet.has(item)); }).join('');
    const hint = highlightTicket
      ? '<div class="search-hint">테두리 표시된 아이템이 <b>' + esc(displayTicketName(highlightTicket.name)) + '</b>에서 나와요</div>'
      : '<div class="search-hint">위에서 변경권을 누르면 그 변경권 아이템만 테두리로 표시돼요</div>';
    panel.innerHTML =
      listControlsHTML() +
      '<div class="detail-title">검색 결과 · ' + items.length + '건</div>' +
      hint +
      '<div class="item-grid mode-' + viewMode + '">' + cards + '</div>';
    return;
  }

  if (!selectedTicket) {
    panel.innerHTML = '<div class="detail-empty">위에서 변경권을 선택하면 아이템 목록이 여기 나와요. 검색을 하면 모든 변경권을 통틀어 찾아줘요.</div>';
    return;
  }

  const ticket = TICKET_DATA.find(function(t){ return t.name === selectedTicket; });
  if (!ticket) { panel.innerHTML = '<div class="detail-empty">선택한 변경권을 찾을 수 없어요.</div>'; return; }

  ensureTicketOrder(ticket.name);

  let items = sortItems(ticket.items);
  if (myCollection && showUnownedOnly) {
    items = items.filter(function(item){ return isItemOwned(item) !== true; });
  }
  const dragEnabled = isAdmin && sortMode === 'recommend';
  const cards = items.map(function(item){ return itemCardHTML(item, '', false, dragEnabled); }).join('');
  const unownedToggleHTML = myCollection
    ? '<div class="unowned-toggle"><span class="ios-switch' + (showUnownedOnly ? ' on' : '') + '" id="lab2-unowned-switch"></span>미보유만 보기</div>'
    : '';
  const dragHintHTML = dragEnabled
    ? '<div class="search-hint">카드를 드래그해서 순서를 바꾸면 추천순으로 저장돼요 (관리자 전용)</div>'
    : '';
  panel.innerHTML =
    '<div class="detail-title">' +
      '<div class="ticket-icon">' + iconHTML(ticket.name, TICKET_IMAGES[ticket.name], true) + '</div>' +
      '<span>' + esc(displayTicketName(ticket.name)) + ' · ' + ticket.items.length + '개</span>' +
    '</div>' +
    listControlsHTML() +
    unownedToggleHTML +
    dragHintHTML +
    '<div class="item-grid mode-' + viewMode + '" id="lab2-item-grid">' + cards + '</div>';
  if (items.length === 0 && myCollection && showUnownedOnly) {
    document.getElementById('lab2-item-grid').outerHTML = '<div class="detail-empty">모두 보유중이에요.</div>';
  } else if (dragEnabled) {
    initDragReorder(document.getElementById('lab2-item-grid'));
  }
}

// ── 콜렉션 연동: 보유 여부 조회 ──
// 보유 판정은 share_codes.data.have가 아니라 share_codes.collection_checked(콤마로 구분된 id 문자열)를 기준으로 함.
function isItemOwned(name){
  if (!myCollection || typeof myCollection.collection_checked !== 'string' || !myCollection.collection_checked) return null;
  const meta = ITEM_META[name];
  if (!meta || meta.id == null) return null;
  return myCollection.collection_checked.split(',').indexOf(String(meta.id)) !== -1;
}

function updateConnectBadge(){
  const badge = document.getElementById('lab2-connect-badge');
  badge.classList.toggle('connected', !!myCollection);
  badge.querySelector('.connect-label').textContent = myCollection ? '연동됨' : '연동';
}

async function loadMyCollectionViaLogin(){
  if (!sb) return;
  try {
    const res = await sb.rpc('get_my_collection');
    if (res.error || !res.data) { updateConnectBadge(); return; }
    myCollection = res.data;
    connectSource = 'login';
    const profRes = await sb.from('profiles').select('is_admin').single();
    isAdmin = !!(profRes.data && profRes.data.is_admin);
  } catch (e) {
    // 네트워크 오류 등은 조용히 무시 (읽기 전용 부가 기능이라 페이지 사용에 지장 없어야 함)
  } finally {
    updateConnectBadge();
    renderDetail();
  }
}

async function connectByCode(code, silent){
  if (!sb) { if (!silent) showConnectMsg('연동 기능을 사용할 수 없어요.'); return false; }
  const trimmed = (code || '').trim();
  if (!trimmed) return false;
  try {
    const res = await sb.rpc('get_collection_by_code', { p_code: trimmed });
    if (res.error || !res.data) {
      if (!silent) showConnectMsg('코드를 찾을 수 없어요.');
      return false;
    }
    myCollection = res.data;
    connectSource = 'code';
    isAdmin = false; // 공유코드 연동은 관리자 권한 없음
    try { localStorage.setItem(MANUAL_CODE_KEY, trimmed); } catch(e){}
    updateConnectBadge();
    renderDetail();
    return true;
  } catch (e) {
    if (!silent) showConnectMsg('연동 중 오류가 발생했어요.');
    return false;
  }
}

function disconnect(){
  myCollection = null;
  connectSource = null;
  isAdmin = false;
  try { localStorage.removeItem(MANUAL_CODE_KEY); } catch(e){}
  if (sb && sb.auth) sb.auth.signOut().catch(function(){});
  updateConnectBadge();
  renderDetail();
  closeConnectModal();
}

async function initConnect(){
  if (!sb) { updateConnectBadge(); return; }
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) { await loadMyCollectionViaLogin(); return; }
  } catch (e) {}
  try {
    const savedCode = localStorage.getItem(MANUAL_CODE_KEY);
    if (savedCode) { await connectByCode(savedCode, true); return; }
  } catch (e) {}
  updateConnectBadge();
}

// ── 관리자 추천순: 변경권별 정렬값 조회/저장 ──
async function ensureTicketOrder(ticketName){
  if (!sb || ticketOrderCache[ticketName]) return;
  ticketOrderCache[ticketName] = {}; // 중복 조회 방지 (빈 값으로 우선 채움)
  try {
    const res = await sb.from('ticket_item_order').select('item_name, sort_order').eq('ticket_name', ticketName);
    if (res.data) {
      const map = {};
      res.data.forEach(function(row){ map[row.item_name] = row.sort_order; });
      ticketOrderCache[ticketName] = map;
      if (selectedTicket === ticketName && sortMode === 'recommend') renderDetail();
    }
  } catch (e) {}
}

async function saveTicketOrder(ticketName, orderedNames){
  if (!sb || !isAdmin) return;
  const rows = orderedNames.map(function(name, i){
    return { ticket_name: ticketName, item_name: name, sort_order: i * 10 };
  });
  const map = {};
  rows.forEach(function(r){ map[r.item_name] = r.sort_order; });
  ticketOrderCache[ticketName] = map;
  try {
    await sb.from('ticket_item_order').upsert(rows, { onConflict: 'ticket_name,item_name' });
  } catch (e) {}
}

// 마우스/터치 포인터 기반 카드 재정렬 (전역 dragstart 차단과 충돌하지 않도록 HTML5 DnD 대신 포인터 이벤트 사용)
let dragState = null;
function initDragReorder(grid){
  if (!grid) return;
  grid.querySelectorAll('.item-card[data-draggable="1"]').forEach(function(card){
    card.addEventListener('mousedown', function(e){ startDrag(e, card, grid); });
  });
}
function startDrag(e, card, grid){
  e.preventDefault();
  dragState = { card: card, grid: grid };
  card.classList.add('dragging');
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
}
function onDragMove(e){
  if (!dragState) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const over = el && el.closest ? el.closest('.item-card') : null;
  dragState.grid.querySelectorAll('.item-card.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
  if (over && over !== dragState.card) over.classList.add('drag-over');
}
function onDragEnd(e){
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
  if (!dragState) return;
  const grid = dragState.grid;
  const card = dragState.card;
  card.classList.remove('dragging');
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const over = el && el.closest ? el.closest('.item-card') : null;
  grid.querySelectorAll('.item-card.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
  if (over && over !== card) {
    const cards = Array.from(grid.children);
    const overIdx = cards.indexOf(over);
    const cardIdx = cards.indexOf(card);
    if (cardIdx < overIdx) grid.insertBefore(card, over.nextSibling);
    else grid.insertBefore(card, over);
    const orderedNames = Array.from(grid.children).map(function(c){ return c.getAttribute('data-name'); });
    saveTicketOrder(selectedTicket, orderedNames);
  }
  dragState = null;
}

// 우클릭 / 드래그 / 개발자도구 단축키 차단

// 완전히 막을 방법은 없음 (모든 브라우저가 그렇게 설계돼 있음). 캐주얼한 접근만 막아줌.

    const pw = document.getElementById('lab2-connect-pw').value;
    if (!email || !pw) { showConnectMsg('이메일/비밀번호를 입력해주세요.'); return; }
    if (!sb) { showConnectMsg('연동 기능을 사용할 수 없어요.'); return; }
    showConnectMsg('로그인 중...');
    const { error } = await sb.auth.signInWithPassword({ email: email, password: pw });
    if (error) { showConnectMsg('로그인에 실패했어요.'); return; }
    await loadMyCollectionViaLogin();
    if (myCollection) closeConnectModal(); else showConnectMsg('연동된 보유 데이터를 찾을 수 없어요.');
    return;
  }
  if (e.target.id === 'lab2-connect-code-btn') {
    const code = document.getElementById('lab2-connect-code').value;
    showConnectMsg('확인 중...');
    const ok = await connectByCode(code);
    if (ok) closeConnectModal();
    return;
  }
  if (e.target.id === 'lab2-disconnect-btn') {
    disconnect();
  }
});

// 아이템 상세보기 모달 — 닫기 / 배경 클릭 / ESC
document.getElementById('lab2-item-modal-close').addEventListener('click', closeItemDetail);
document.getElementById('lab2-item-modal').addEventListener('click', function(e){
  if (e.target.id === 'lab2-item-modal') closeItemDetail();
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') { closeItemDetail(); closeConnectModal(); }
});

// 모달 안 변경권 칩을 누르면 그 변경권을 선택하고 모달을 닫음
document.getElementById('lab2-item-modal-body').addEventListener('click', function(e){
  const chip = e.target.closest('.detail-ticket-chip');
  if (!chip) return;
  selectedTicket = chip.getAttribute('data-ticket');
  document.getElementById('lab2-search').value = '';
  applySearch();
  closeItemDetail();
  document.getElementById('lab2-detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// 이름 복사 버튼
document.getElementById('lab2-item-copy-btn').addEventListener('click', function(){
  const btn = this;
  const name = btn.dataset.copyName || '';
  if (!name) return;
  const showCopied = function(){
    btn.textContent = '복사됨';
    btn.classList.add('copied');
    setTimeout(function(){
      btn.textContent = '이름 복사';
      btn.classList.remove('copied');
    }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(name).then(showCopied).catch(function(){
      fallbackCopy(name); showCopied();
    });
  } else {
    fallbackCopy(name); showCopied();
  }
});

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (err) { /* 무시 */ }
  document.body.removeChild(ta);
}
</script>
